name: Build PickTV APK

on:
  push:
    branches:
      - feature/picktv-r1-remove-updater
  workflow_dispatch:

# 新提交觸發建置時，自動取消同分支卡住的舊建置。
concurrency:
  group: picktv-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.10 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: 'x64'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Fetch pinned FongMi Media3 Maven artifacts
        run: |
          git clone --filter=blob:none --no-checkout --depth 1 https://github.com/leilingzero/webhtv.git /tmp/picktv-media3
          cd /tmp/picktv-media3
          git sparse-checkout init --cone
          git sparse-checkout set third_party/maven
          git fetch --depth 1 origin aa40d27f4d095d6c6411a4119b0ea0b1789c7a6c
          git checkout aa40d27f4d095d6c6411a4119b0ea0b1789c7a6c
          mkdir -p "$GITHUB_WORKSPACE/third_party"
          cp -a third_party/maven "$GITHUB_WORKSPACE/third_party/maven"

      - name: Prepare local Gradle signing properties
        run: |
          cat > local.properties <<'EOF'
          storeFile=ci-unused.jks
          keyAlias=ci-unused
          storePassword=ci-unused
          EOF

      - name: Build all debug APK variants
        run: timeout 50m bash ./gradlew assembleDebug --no-daemon --stacktrace --console=plain

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PickTV-R1-debug-APKs
          path: app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
          retention-days: 14
