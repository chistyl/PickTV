name: Build PickTV APK

on:
  push:
    branches:
      - feature/picktv-r1-remove-updater
  workflow_dispatch:

concurrency:
  group: picktv-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.mode }} ${{ matrix.abi }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 130
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: leanback
            abi: arm64_v8a
            variant: LeanbackArm64_v8a
          - mode: leanback
            abi: armeabi_v7a
            variant: LeanbackArmeabi_v7a
          - mode: mobile
            abi: arm64_v8a
            variant: MobileArm64_v8a
          - mode: mobile
            abi: armeabi_v7a
            variant: MobileArmeabi_v7a
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Package complete source archive
        if: matrix.variant == 'LeanbackArm64_v8a'
        run: git archive --format=zip --output=PickTV-source.zip HEAD

      - name: Upload source archive
        if: matrix.variant == 'LeanbackArm64_v8a'
        uses: actions/upload-artifact@v4
        with:
          name: PickTV-R1-source
          path: PickTV-source.zip
          if-no-files-found: error
          retention-days: 14

      - name: Set up Python 3.10 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: 'x64'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Fetch pinned FongMi Media3 Maven artifacts
        run: |
          git clone --filter=blob:none --no-checkout --depth 1 https://github.com/leilingzero/webhtv.git /tmp/picktv-media3
          cd /tmp/picktv-media3
          git sparse-checkout init --cone
          git sparse-checkout set third_party/maven
          git fetch --depth 1 origin aa40d27f4d095d6c6411a4119b0ea0b1789c7a6c
          git checkout aa40d27f4d095d6c6411a4119b0ea0b1789c7a6c
          mkdir -p "$GITHUB_WORKSPACE/third_party"
          cp -a third_party/maven "$GITHUB_WORKSPACE/third_party/maven"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare local Gradle signing properties
        run: |
          cat > local.properties <<'EOF'
          storeFile=ci-unused.jks
          keyAlias=ci-unused
          storePassword=ci-unused
          EOF

      - name: Configure Gradle memory
        run: |
          printf '\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\norg.gradle.workers.max=2\nkotlin.daemon.jvmargs=-Xmx2g\n' >> gradle.properties

      - name: Build selected APK variant
        run: timeout --signal=TERM --kill-after=30s 120m bash ./gradlew :app:assemble${{ matrix.variant }}Debug --no-daemon --stacktrace --info --console=plain --max-workers=2 --build-cache

      - name: Upload selected APK
        uses: actions/upload-artifact@v4
        with:
          name: PickTV-R1-${{ matrix.mode }}-${{ matrix.abi }}-debug-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
